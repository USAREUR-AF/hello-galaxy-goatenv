# goatnet-from-scratch: the goatnet the tutorials build (docs/design/goatnet-tutorials.md).
# One environment, `zagros`. Tutorial 1 declares its founder site `alpha`;
# tutorial 2 adds the joiner site `beta`; tutorial 3 declares a peering with an
# ally or partner, `hello-ally`, who runs their own goatnet. The difference
# from tutorial 2 is exactly the edge class the boundary router runs on and the
# one `peerings:` entry.
schema: goatbuilder/v1
preset: lite
repo:
  source: example-org/goatnet-from-scratch
  image_namespace: ghcr.io/example-org
components:
  netbird-mgmt:
    declared_in: declared/pins.yaml
  zenoh-router:
    declared_in: declared/pins.yaml
  portal:
    declared_in: declared/pins.yaml
  obs-stack:
    declared_in: declared/pins.yaml
  breakglass-node:
    declared_in: declared/pins.yaml
  spock-subscriptions:
    declared_in: declared/pins.yaml
  spock-mesh-wire:
    declared_in: declared/pins.yaml
environments:
  - name: zagros
    converger: push-ansible
    sites:
      - name: alpha
        role: founder
        classes:
          core: {}
          obs: {}
          breakglass: {}
          # The boundary node: a dedicated edge host, on neither sovereign's
          # management plane, where the per-partner router process runs.
          edge: {}
      - name: beta
        role: joiner
        joins: alpha
        classes:
          core: {}
peerings:
  # A peering with an ally or partner who runs their own goatnet. `goatbuilder
  # federate hello-ally` stands it up in fourteen phases; data crosses only under
  # the agreed release prefixes. The edge router runs in the `edge` class at
  # `alpha`. Declaring it here is the "declare it first" discipline federate's
  # C1 check enforces.
  - with: hello-ally
    environment: zagros
    site: alpha
    edge_class: edge
promotion:
  path:
    - name: zagros
      kind: rung
      environment: zagros
