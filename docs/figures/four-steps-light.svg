<title id="t">Four rehearsed steps: one box, a goatnet, a second site, a partner peering</title>
<desc id="d">step 0, goatlite: one box, one file: goatnet pasture, 6 of 6 converged on 1 machine (pasture-core-1); step 1, A new goatnet: goatnet zagros, 8 of 8 converged on 4 machines (alpha-breakglass-1, alpha-core-1, alpha-core-2, alpha-obs-1); step 2, The first federated node: goatnet zagros, 13 of 13 converged on 5 machines (alpha-breakglass-1, alpha-core-1, alpha-core-2, beta-core-1, alpha-obs-1); step 3, A boundary node for partner sharing: federate hello-ally, a plan of 14 phases that is printed, not run.</desc>
