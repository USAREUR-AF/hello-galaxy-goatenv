# goatlite, rehearsed: one environment `pasture`, one founder site `pasture`,
# one class `core`, one machine. Both names derive from lite.name in
# goatbuilder.yaml; nothing here is declared twice.
#
# machines: how the one machine behaves under the scripted converger
# (converger.yaml in fixtures/basic/ lists the vocabulary).
#
# standup: the doctrine's phase order for the tier-1 set, class to components.
# Phase numbers are the standup driver's: 5 the management stack, 6 the
# identity service, 9 the router and the workload-identity server, 12 the
# service surface. No obs host, no rescue class: a lite site has neither.
machines:
  pasture:
    pasture-core-1: converge-now
standup:
  env: pasture
  site: pasture
  classes:
    core: [pasture-core-1]
  phases:
    - { phase: 5, class: core, components: [netbird-mgmt] }
    - { phase: 6, class: core, components: [ory] }
    - { phase: 9, class: core, components: [zenoh-router, spire] }
    - { phase: 12, class: core, components: [portal, grant-keyd] }
