# goatnet-from-scratch, step 0: goatlite (ADR 1213, docs/design/goatlite.md).
# The learner's whole declaration is the lite: block — four facts. No
# environments, no promotion: the preset derives one environment `pasture`
# (push-ansible, transport direct, group pasture_hosts), one founder site
# `pasture` with the class `core`, one rung, and the env-file secrets store.
# repo and components stay explicit; the components are the tier-1 set a
# goatlite stands up on its one box.
schema: goatbuilder/v1
preset: lite
lite:
  name: pasture
  host: pasture-box.lan
  ssh_user: ubuntu
  admin: admin@example.org
repo:
  source: example-org/goatnet-from-scratch
  image_namespace: ghcr.io/example-org
components:   # the tier-1 set a goatlite stands up
  netbird-mgmt: {declared_in: declared/pins.yaml}
  ory: {declared_in: declared/pins.yaml}
  zenoh-router: {declared_in: declared/pins.yaml}
  spire: {declared_in: declared/pins.yaml}
  portal: {declared_in: declared/pins.yaml}
  grant-keyd: {declared_in: declared/pins.yaml}
