# The acceptance assay's value set for goatlite's one site `pasture`, as
# ops/validation/generate-values.py derives one from a real site's group_vars.
# Only the applicability flags matter to `goatbuilder assay --plan`; addresses
# are documentation ranges and probe nothing. A lite site: LAN profile, no obs
# host, no rescue classes, no relays, tier ceiling 1.
site_id: "pasture"
goat_context: "pasture"
goat_via: "localhost"
goatbuilder_env: "pasture"
goatnet_founder: true
participates_in_spock: false
spock_joiner: false
zenoh_rest_port: "8000"
onboard_runner_enabled: false
has_obs_host: false
has_breakglass_node: false
has_network_jump_node: false
intra_site_pair: false
luks_tang_unlock: false
name_snapshot_enabled: false
rosenpass_enabled: false
relay_public_ips: []
orin_a: "ubuntu@192.0.2.50"
mesh_ip_a: "192.0.2.50"
site_dns_zone: "pasture.lan"
