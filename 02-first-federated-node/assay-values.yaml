# The acceptance assay's value set for goatnet-from-scratch's joiner site `beta`, the
# site tutorial 2 adds, as ops/validation/generate-values.py derives one from a
# real site's group_vars.
# Only the applicability flags matter to `goatbuilder assay --plan`, which the
# tutorial rehearses; addresses are documentation ranges and probe nothing.
site_id: "zagros"
goat_context: "zagros-beta"
goat_via: "localhost"
goatbuilder_env: "zagros"
goatnet_founder: false
participates_in_spock: true
spock_joiner: true
goat_context_peer: "zagros-alpha"
spock_ory_dbs: ["kratos", "hydra"]
zenoh_rest_port: "8000"
onboard_runner_enabled: true
has_obs_host: false
has_breakglass_node: false
has_network_jump_node: false
intra_site_pair: false
luks_tang_unlock: false
name_snapshot_enabled: true
rosenpass_enabled: false
relay_public_ips: ["192.0.2.20"]
orin_a: "goat@192.0.2.31"
mesh_ip_a: "192.0.2.31"
site_dns_zone: "zagros.example"
