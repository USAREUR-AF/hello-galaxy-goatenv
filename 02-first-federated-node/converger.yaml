# Tutorial 2 — the first federated node: joiner site `beta` attaches to the
# founder `alpha` (ADR 1084), rehearsed.
#
# records/ starts where tutorial 1 ended: the founder's machines already carry
# their converged records (copied from tutorial 1's checkpoint), so this
# rehearsal begins from a goatnet that exists.
#
# standup: the joiner's phases. 5 the management stack, pass 1 (the account is
# not seeded here; it arrives by replication); 6 the replication subscriptions
# on the joiner, then the founder-side mirror on the FOUNDER's machines, so the
# subscriptions exist in both directions; 9 the joiner's own router. The
# mirror is recorded on the founder's machines (`alpha/core` names the founder's
# class): a joiner's standup changes the founder, and the rehearsal shows it.
machines:
  zagros:
    alpha-core-1: converge-now
    alpha-core-2: converge-now
    alpha-obs-1: converge-now
    alpha-breakglass-1: converge-now
    beta-core-1: converge-now
standup:
  env: zagros
  site: beta
  classes:
    core: [beta-core-1]
    alpha/core: [alpha-core-1, alpha-core-2]
  phases:
    - { phase: 5, class: core, components: [netbird-mgmt] }
    - { phase: 6, class: core, components: [spock-subscriptions] }
    - { phase: 6, class: alpha/core, components: [spock-mesh-wire] }
    - { phase: 9, class: core, components: [zenoh-router] }
  # What tutorial 1 converged, still expected: the founder's records travel
  # with the goatnet (records/ is seeded from tutorial 1's checkpoint).
  carried:
    netbird-mgmt: [alpha-core-1, alpha-core-2]
    zenoh-router: [alpha-core-1, alpha-core-2]
    obs-stack: [alpha-obs-1]
    portal: [alpha-core-1, alpha-core-2]
    breakglass-node: [alpha-breakglass-1]
