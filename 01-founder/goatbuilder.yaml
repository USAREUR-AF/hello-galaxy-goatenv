# goatnet-from-scratch: the goatnet the tutorials build (docs/design/goatnet-tutorials.md).
# One environment, `zagros`. Tutorial 1 declares its founder site `alpha`;
# tutorial 2 adds the joiner site `beta` (ADR 1084) and the two components a
# joiner brings. The two copies of this file differ by exactly that.
schema: goatbuilder/v1
preset: lite
repo:
  source: example-org/goatnet-from-scratch
  image_namespace: ghcr.io/example-org
components:
  netbird-mgmt:
    declared_in: declared/pins.yaml
  zenoh-router:
    declared_in: declared/pins.yaml
  portal:
    declared_in: declared/pins.yaml
  obs-stack:
    declared_in: declared/pins.yaml
  breakglass-node:
    declared_in: declared/pins.yaml
environments:
  - name: zagros
    converger: push-ansible
    sites:
      - name: alpha
        role: founder
        classes:
          core: {}
          obs: {}
          breakglass: {}
promotion:
  path:
    - name: zagros
      kind: rung
      environment: zagros
