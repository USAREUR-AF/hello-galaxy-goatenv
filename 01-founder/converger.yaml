# Tutorial 1 — a new goatnet, founder site `alpha`, rehearsed.
#
# machines: how each machine behaves under the scripted converger. alpha-core-2
# converges on its second observation, so the rehearsal shows `standup` keeps
# observing a class until every record agrees (C5, C7).
#
# standup: the site's classes and the doctrine's phase order, class to
# components. Phase numbers are the standup driver's: 5 the management stack,
# 9 the router and the observability stack, 12 the service surface, 14 the
# rescue class (ADR 1183).
machines:
  zagros:
    alpha-core-1: converge-now
    alpha-core-2: { after: 2 }
    alpha-obs-1: converge-now
    alpha-breakglass-1: converge-now
standup:
  env: zagros
  site: alpha
  classes:
    core: [alpha-core-1, alpha-core-2]
    obs: [alpha-obs-1]
    breakglass: [alpha-breakglass-1]
  phases:
    - { phase: 5, class: core, components: [netbird-mgmt] }
    - { phase: 9, class: core, components: [zenoh-router] }
    - { phase: 9, class: obs, components: [obs-stack] }
    - { phase: 12, class: core, components: [portal] }
    - { phase: 14, class: breakglass, components: [breakglass-node] }
